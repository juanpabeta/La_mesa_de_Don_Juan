services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB debe estar definido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER debe estar definido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definido}
    volumes:
      - restaurantes_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV debe estar definido}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY debe estar definido}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS debe estar definido}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE debe estar definido}
      ENABLE_DELAY_MONITOR: ${ENABLE_DELAY_MONITOR:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  restaurantes_db_data:
