services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: kitchen_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on: [db]
volumes:
  postgres_data:
